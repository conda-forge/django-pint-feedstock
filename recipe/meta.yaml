{% set name = "django-pint" %}
{% set version = "1.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 0d7c556d6962ca3d450d1b5f331f85cba9a2f68c47915d7ad97c46bbe1efec46

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.8
    - setuptools >=46.1.0
    - setuptools-scm >=5
    - wheel
    - pip
  run:
    - python >=3.8
    - django >=3.2
    - pint >=0.16

test:
  commands:
    - pip check
  requires:
    - pip
    - pytest

about:
  home: https://github.com/CarliJoy/django-pint/
  summary: '"Quantity Field for Django using pint library for automated unit conversions"'
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - alexpilot11
    - BryanAke
